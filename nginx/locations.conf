# Relative redirects keep the client's host and port (/broker -> /broker/).
absolute_redirect off;

# Every proxy_pass carries a URI so nginx forwards the normalized path.
# Without one it forwards the raw path, and /metrics/..%2Fx would match
# location / here but still reach LiteLLM's /metrics mount.

location /broker/ {
    proxy_pass http://key-broker:8090/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /metrics {
    include /etc/nginx/metrics-access.conf;
    proxy_pass http://litellm:4000/metrics;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://litellm:4000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 20m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
